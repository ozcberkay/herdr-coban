name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/
      - name: Layout copies match their mods
        run: sh scripts/sync-layout-mods.sh --check
      - name: JSON files parse
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 |
            xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'
      - name: Shell scripts
        run: |
          brew install shellcheck
          shellcheck claude-status/mods/claude-status/statusline.sh scripts/sync-layout-mods.sh
